services:
  # Stack-unique service name. A bare `web`/`backend` would collide with other
  # stacks through Dokploy's shared network aliases.
  vp-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://varietyportal.com}
        PUBLIC_GA_MEASUREMENT_ID: ${PUBLIC_GA_MEASUREMENT_ID:-}
        PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-}
        PUBLIC_BOOKING_URL: ${PUBLIC_BOOKING_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://varietyportal.com}
      MONGO_URL: mongodb://vp-mongo:27017
      MONGO_DB: ${MONGO_DB:-varietyportal}
      EMAILIT_URL: ${EMAILIT_URL:-https://api.emailit.com/v2/}
      EMAILIT_API_KEY: ${EMAILIT_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_INTERNAL_TO: ${EMAIL_INTERNAL_TO:-}
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on:
      vp-mongo:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    # Security headers are set at the proxy, not in Astro middleware: middleware
    # does not run for prerendered pages, and this also covers static assets.
    # Dokploy attaches `vp-secheaders@docker` to the routers it generates for
    # this service's domains.
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.vp-secheaders.headers.stsSeconds=63072000
      - traefik.http.middlewares.vp-secheaders.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.vp-secheaders.headers.stsPreload=true
      - traefik.http.middlewares.vp-secheaders.headers.contentTypeNosniff=true
      - traefik.http.middlewares.vp-secheaders.headers.frameDeny=true
      - traefik.http.middlewares.vp-secheaders.headers.browserXssFilter=true
      - traefik.http.middlewares.vp-secheaders.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.vp-secheaders.headers.customResponseHeaders.Permissions-Policy=accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()
      - "traefik.http.middlewares.vp-secheaders.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https://designsystem.bowtiekreative.com; font-src 'self' data:; style-src 'self' 'unsafe-inline' https://designsystem.bowtiekreative.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; manifest-src 'self'; upgrade-insecure-requests"

  # Stack-private only: no Traefik route, so it never joins dokploy-network
  # and its name cannot collide with another project's database.
  vp-mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--quiet", "--bind_ip_all"]
    volumes:
      - vp-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - default

volumes:
  vp-mongo-data:

networks:
  default:
  dokploy-network:
    external: true
